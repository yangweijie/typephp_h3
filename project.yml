name: h3php
build-mode: bin
version: 0.1.0
cxx-std: c++17
cxx-flags: |
  -framework Metal
  -framework MetalKit
  -framework Foundation
  -framework Accelerate
ld-flags: |
  -framework Metal
  -framework MetalKit
  -framework Foundation
  -framework Accelerate
  -lobjc
sources:
  - php-src
  - cpp-src
ignore:
  - ./php-src/Testing
