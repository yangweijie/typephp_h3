name: h3php
build-mode: bin
version: 0.1.0
cxx-std: c++17

sources:
  - php-src
  - cpp-src

cxx-flags: |
  -fobjc-arc
  -framework Metal
  -framework MetalKit
  -framework Foundation
  -framework Accelerate
  -Imetal-cpp-main

ld-flags: |
  -framework Metal
  -framework MetalKit
  -framework Foundation
  -framework Accelerate
  -framework MetalPerformanceShaders
  -framework MetalPerformanceShadersGraph
  -licucore

ignore:
  - ./php-src/Testing
