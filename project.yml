name: h3php
build-mode: bin
version: 0.1.0
cxx-std: c++17

sources:
  - php-src
  - cpp-src

cxx-flags: |
  -fobjc-arc
  -framework Metal
  -framework MetalKit
  -framework Foundation
  -framework Accelerate
  -Imetal-cpp-main
  -DQT_WIDGETS_LIB
  -DQT_GUI_LIB
  -DQT_CORE_LIB

ld-flags: |
  -framework Metal
  -framework MetalKit
  -framework Foundation
  -framework Accelerate
  -framework MetalPerformanceShaders
  -framework MetalPerformanceShadersGraph
  -licucore
  -framework Qt6Widgets
  -framework Qt6Gui
  -framework Qt6Core

# Platform-specific overrides (uncomment for your platform):
#
# Windows (MSVC + Qt 6.8):
#   cxx-flags: -DQT_WIDGETS_LIB -DQT_GUI_LIB -DQT_CORE_LIB -IC:\Qt\6.8.0\msvc2022_64\include
#   ld-flags: Qt6Widgets.lib Qt6Gui.lib Qt6Core.lib
#
# Linux (gcc + system Qt 6):
#   cxx-flags: -DQT_WIDGETS_LIB -DQT_GUI_LIB -DQT_CORE_LIB -I/usr/include/x86_64-linux-gnu/qt6
#   ld-flags: -lQt6Widgets -lQt6Gui -lQt6Core

ignore:
  - ./php-src/Testing
