# H3PHP — Default Configuration
#
# Default settings for the MiniMax-H3 video generation engine.
# CLI flags override these values.

# Canvas settings
canvas:
  width: 864
  height: 480
  frames: 56
  fps: 24

# Sampling settings
sampling:
  steps: 20
  denoise_reuse: 1        # 1=quality, 2=fast, 3=aggressive
  dit_layers: 50           # 50=exact, 45=fast, 40=aggressive, min 35
  core_reuse: 1            # 1=exact, 4=fast, 6=aggressive

# Optimization settings
optimization:
  token_reduction: false
  ssd_streaming: false
  use_int8_row_fc2: false
  use_reference_rope: false

# Precision settings (for parity testing)
precision:
  use_slower_bf16_mlp: false
  use_slower_bf16_qkv: false
  use_slower_bf16_attention_output: false

# Output settings
output:
  directory: outputs
  format: mp4
  codec_video: libx264
  codec_audio: aac
  crf: 18
  audio_bitrate: 192k

# Display settings
display:
  show_previews: false
  zoom: 2

# Super-resolution settings
super_resolution:
  enabled: false
  bin_path: null
  model_dir: null
  model_name: realesrgan-x4plus
  scale: 4

# Memory settings
memory:
  auto_plan: true

# Profiling
profiling:
  enabled: false


# model_manifest.yaml
#
# 组件路径取自 C 参考实现 (h3.c) 的本次运行：
#   cd /Volumes/data/git/c/h3.c && ./h3 -d /Users/jay/h3_sys/MiniMax-H3-Convrot ...
#   H3_CLIPPROJ_DIR=/Volumes/data/.lmstudio/models/Qwen3-VL-4B-Instruct-int8-convrot
#   H3_CLIPPROJ_PROJ=/Volumes/data/.lmstudio/models/ClipProj-MiniMax-H3
# 布局规则：MODEL_DIR/FL2VA/<component>
fl2va:
  transformer: /Users/jay/h3_sys/MiniMax-H3-Convrot/FL2VA/transformer
  tokenizer:   /Users/jay/h3_sys/MiniMax-H3-Convrot/FL2VA/tokenizer
  # text_encoder 不在 FL2VA/ 内（该目录无 text_encoder 子目录）；
  # 本次运行由 H3_CLIPPROJ_DIR 指向外部 Qwen3-VL-4B 目录充当文本编码器
  text_encoder: /Volumes/data/.lmstudio/models/Qwen3-VL-4B-Instruct-int8-convrot
  video_vae:   /Users/jay/h3_sys/MiniMax-H3-Convrot/FL2VA/video_vae
  audio_vae:   /Users/jay/h3_sys/MiniMax-H3-Convrot/FL2VA/audio_vae
  # ClipProj 投影 (对应 C 的 H3_CLIPPROJ_PROJ)
  clipproj:    /Volumes/data/.lmstudio/models/ClipProj-MiniMax-H3
# ref2va:
#   transformer: /Volumes/SSD/H3/Ref2VA/transformer