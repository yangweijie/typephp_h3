[PHP]
; H3PHP — Minimal php.ini for standalone binary
; This file is auto-loaded by cpp-src/php_ini_auto.cc which sets
; php_embed_module.php_ini_path_override before PHP initializes.

; Extension directory — points to the ext/ folder in the tpc package.
; For deployment, copy the ext/ directory from the tpc package alongside
; this exe and change this to: extension_dir = "ext"
extension_dir = "D:\git\php\tpc_v0.6.8_windows_x64\ext"

; Core settings
date.timezone = UTC
memory_limit = -1

; Enabled extensions (subset of what the tpc package provides)
extension = curl
extension = mbstring
extension = openssl
extension = pdo_mysql
extension = pdo_pool
extension = sockets
extension = zip

; OPcache
opcache.enable = 1
opcache.jit_buffer_size = 256M
opcache.jit = 1235
